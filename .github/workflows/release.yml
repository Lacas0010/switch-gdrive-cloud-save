name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão para lançamento (ex: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: ${TAG}"

      - name: Compile gdrive-sync.nro (devkitPro Docker)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            devkitpro/devkita64:latest \
            /bin/bash -c "dkp-pacman -S --noconfirm switch-dev switch-curl switch-mbedtls switch-zlib && make -C gui clean && make -C gui"

      - name: Verify Compiled Binary
        run: |
          if [ ! -f "gui/gdrive-sync.nro" ]; then
            echo "::error::Binário gui/gdrive-sync.nro não foi gerado pelo processo de build."
            exit 1
          fi
          cp gui/gdrive-sync.nro ./gdrive-sync.nro
          ls -lh gdrive-sync.nro

      - name: Package SD Card Distribution (.zip)
        run: |
          TAG="${{ steps.vars.outputs.tag_name }}"
          DIST_DIR="sd_package"
          rm -rf "${DIST_DIR}" "gdrive-sync-${TAG}.zip"
          
          # Estrutura padrão para extração direta na raiz do cartão SD
          mkdir -p "${DIST_DIR}/switch/gdrive-sync"
          mkdir -p "${DIST_DIR}/config/gdrive-sync"

          # 1. Copia o binário NRO
          cp gui/gdrive-sync.nro "${DIST_DIR}/switch/gdrive-sync/gdrive-sync.nro"

          # 2. Copia o modelo de configuração
          cp config.example.json "${DIST_DIR}/config/gdrive-sync/config.example.json"

          # 3. Baixa os certificados CA públicos da Mozilla para TLS/HTTPS
          curl -sL https://curl.se/ca/cacert.pem -o "${DIST_DIR}/config/gdrive-sync/cacert.pem"

          # 4. Gera arquivo compactado (.zip)
          cd "${DIST_DIR}"
          zip -r "../gdrive-sync-${TAG}.zip" switch config
          cd ..

          ls -lh "gdrive-sync-${TAG}.zip"

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          TAG="${{ steps.vars.outputs.tag_name }}"
          python3 -c "
          import re
          tag_clean = '${TAG}'.lstrip('v')
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              # Procura a seção ## [0.1.0] até a próxima seção de versão
              pattern = r'## \[' + re.escape(tag_clean) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
              else:
                  notes = 'Release oficial da versão ' + '${TAG}'
          except Exception as e:
              notes = 'Release oficial da versão ' + '${TAG}'

          with open('release_notes.md', 'w', encoding='utf-8') as out:
              out.write(notes + '\n')
          "
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "gdrive-sync ${{ steps.vars.outputs.tag_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            gdrive-sync.nro
            gdrive-sync-${{ steps.vars.outputs.tag_name }}.zip
